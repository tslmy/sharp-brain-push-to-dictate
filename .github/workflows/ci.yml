name: ci
on:
  push:
  pull_request:
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Static armel binaries
        run: |
          docker build -t moonstt-build -f packaging/Dockerfile.build packaging
          docker run --rm -v "$PWD":/pkg -w /pkg moonstt-build make all
      - name: Native engine build
        run: make host
